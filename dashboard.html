<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 프로젝트 — 리와인드</title>
<link rel="icon" type="image/png" href="./리와인드_로고1_512px.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0c0c0c; --bg-raised: #161616; --bg-input: #1c1c1c; --line: #2a2a2a;
    --ink: #f5f3ee; --ink-dim: #a8a49b; --ink-faint: #6f6b62;
    --amber: #c68a12; --amber-dim: #7a5a1c; --olive: #d4af37; --focus: #c68a12;
    --card-shadow: none; --on-amber: #14100a;
    --status-plan: #6f6b62; --status-making: #c68a12; --status-review: #d4af37;
    --status-final: #4c8a82; --status-done: #6fae4a; --status-error: #c96a5a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbf3e3; --bg-raised: #ffffff; --bg-input: #ffffff; --line: #eadfc4;
      --ink: #241c11; --ink-dim: #6b5b3d; --ink-faint: #9c8d6c;
      --amber: #c68a12; --amber-dim: #f3e1ae; --olive: #8a6d1f;
      --card-shadow: 0 8px 20px -12px rgba(36,28,17,0.12); --on-amber: #1c1409;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0c; --bg-raised: #161616; --bg-input: #1c1c1c; --line: #2a2a2a;
    --ink: #f5f3ee; --ink-dim: #a8a49b; --ink-faint: #6f6b62;
    --amber: #c68a12; --amber-dim: #7a5a1c; --olive: #d4af37;
    --card-shadow: none; --on-amber: #14100a;
  }
  :root[data-theme="light"] {
    --bg: #fbf3e3; --bg-raised: #ffffff; --bg-input: #ffffff; --line: #eadfc4;
    --ink: #241c11; --ink-dim: #6b5b3d; --ink-faint: #9c8d6c;
    --amber: #c68a12; --amber-dim: #f3e1ae; --olive: #8a6d1f;
    --card-shadow: 0 8px 20px -12px rgba(36,28,17,0.12); --on-amber: #1c1409;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, .display { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* ---- shell header (shared across pages) ---- */
  header.shell {
    position: sticky; top: 0; z-index: 50;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; text-decoration: none; }
  .logo img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  .shell-right { display: flex; align-items: center; gap: 14px; }
  .btn-primary {
    background: var(--amber); color: var(--on-amber); font-weight: 600;
    border: none; padding: 11px 20px; border-radius: 3px;
    font-size: 0.92rem; cursor: pointer; text-decoration: none; display: inline-block;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(226,162,60,0.25); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); }
  .account-menu { position: relative; }
  .account-trigger { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px; }
  .account-dropdown {
    display: none; position: absolute; right: 0; top: calc(100% + 8px);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 6px;
    min-width: 180px; box-shadow: var(--card-shadow), 0 10px 30px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .account-dropdown.open { display: block; }
  .account-dropdown button {
    width: 100%; text-align: left; background: none; border: none; color: var(--ink-dim);
    padding: 11px 14px; font-size: 0.88rem; cursor: pointer; font-family: inherit;
  }
  .account-dropdown button:hover { background: var(--bg-input); color: var(--ink); }

  main { padding: 44px 20px 100px; }

  /* ---- breadcrumb — quiet wayfinding, not decoration ---- */
  .breadcrumb {
    max-width: 880px; margin: 0 auto; padding: 14px 20px 0;
    display: flex; align-items: center; gap: 6px;
    font-size: 0.8rem; color: var(--ink-faint);
  }
  .breadcrumb a { color: var(--ink-faint); text-decoration: none; }
  .breadcrumb a:hover { color: var(--ink-dim); }
  .breadcrumb .sep { opacity: 0.5; }
  .breadcrumb .here { color: var(--ink-dim); }

  /* ---- unified page-enter — one orchestrated moment, not per-element ---- */
  main { animation: enter 0.45s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }

  .page-head h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); }
  .page-head p { color: var(--ink-faint); font-size: 0.92rem; margin-top: 6px; }

  /* ---- gate: not signed in ---- */
  #gate {
    text-align: center; padding: 80px 20px;
  }
  #gate p { color: var(--ink-dim); margin: 14px 0 22px; }
  #gsi-area { display: flex; justify-content: center; }

  /* ---- loading ---- */
  #loading { display: none; padding: 60px 0; text-align: center; color: var(--ink-faint); font-size: 0.92rem; }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 14px;
    border: 2px solid var(--line); border-top-color: var(--amber); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* ---- empty state — reuses the cinema-screen motif from the landing page ---- */
  #empty { display: none; }
  .cinema {
    position: relative; max-width: 320px; margin: 0 auto 22px;
    border-radius: 10px; border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--bg-raised), color-mix(in srgb, var(--bg) 70%, black));
    padding: 46px 20px; text-align: center;
  }
  .cinema .play-btn {
    width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%;
    border: 1px solid var(--amber-dim); color: var(--amber);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .cinema h3 { font-size: 1.15rem; margin-bottom: 6px; }
  .cinema p { color: var(--ink-faint); font-size: 0.9rem; margin: 0; }
  #empty .btn-primary { margin-top: 4px; }

  /* ---- project list — "film canister" rows, not generic cards ---- */
  #project-list { display: none; }
  .reel-row {
    display: grid;
    grid-template-columns: 4px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
  }
  .reel-row:hover { border-color: var(--ink-faint); }
  .reel-edge { align-self: stretch; background: var(--status-plan); }
  .reel-row[data-status="제작 중"] .reel-edge { background: var(--status-making); }
  .reel-row[data-status="검수 대기"] .reel-edge { background: var(--status-review); }
  .reel-row[data-status="검수완료"] .reel-edge { background: var(--status-final); }
  .reel-row[data-status="배포"] .reel-edge { background: var(--status-done); }
  .reel-row[data-error="1"] .reel-edge { background: var(--status-error); }

  .reel-icon {
    width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 1.3rem;
    background:
      radial-gradient(circle at 8px 8px, var(--bg) 3px, transparent 3.4px),
      radial-gradient(circle at 48px 8px, var(--bg) 3px, transparent 3.4px),
      radial-gradient(circle at 8px 48px, var(--bg) 3px, transparent 3.4px),
      radial-gradient(circle at 48px 48px, var(--bg) 3px, transparent 3.4px),
      var(--bg-input);
    flex-shrink: 0;
  }
  .reel-body { padding: 12px 16px; min-width: 0; }
  .reel-title { font-size: 0.98rem; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reel-meta { font-size: 0.8rem; color: var(--ink-faint); margin-top: 3px; }
  .reel-meta .err { color: var(--status-error); }

  .status-chip {
    justify-self: end; margin-right: 14px;
    font-size: 0.78rem; padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap;
  }
  .reel-row[data-status="제작 중"] .status-chip { color: var(--status-making); border-color: color-mix(in srgb, var(--status-making) 40%, var(--line)); }
  .reel-row[data-status="배포"] .status-chip { color: var(--status-done); border-color: color-mix(in srgb, var(--status-done) 40%, var(--line)); }
  .reel-row[data-error="1"] .status-chip { color: var(--status-error); border-color: color-mix(in srgb, var(--status-error) 40%, var(--line)); }

  .reel-arrow { justify-self: end; padding-right: 16px; color: var(--ink-faint); font-size: 1.1rem; }

  @media (max-width: 560px) {
    .reel-icon { width: 44px; height: 44px; font-size: 1rem; }
    .reel-body { padding: 10px 10px; }
    .status-chip { display: none; }
  }
</style>
</head>
<body>

<header class="shell">
  <a class="logo" href="./index.html"><img src="./리와인드_로고1_512px.png" alt=""> 리와인드</a>
  <div class="shell-right">
    <a class="btn-primary" href="./new.html">+ 새 영상 만들기</a>
    <div class="account-menu" id="account-menu" style="display:none;">
      <button class="account-trigger" id="account-trigger" aria-haspopup="true" aria-expanded="false">
        <img class="avatar" id="account-avatar" src="" alt="">
      </button>
      <div class="account-dropdown" id="account-dropdown">
        <button type="button" id="logout-btn">로그아웃</button>
      </div>
    </div>
  </div>
</header>

<nav class="breadcrumb" aria-label="현재 위치">
  <a href="./index.html">리와인드</a>
  <span class="sep">›</span>
  <span class="here">내 프로젝트</span>
</nav>

<main class="wrap">

  <div id="gate">
    <h1 style="font-size:1.5rem; margin-bottom:10px;">내 프로젝트를 보려면 로그인해주세요</h1>
    <p>신청하실 때 사용한 구글 계정으로 로그인하시면, 지금까지 만든 영상을 모두 볼 수 있어요.</p>
    <div id="gsi-area"></div>
  </div>

  <div id="content" style="display:none;">
    <div class="page-head">
      <div>
        <h1>내 프로젝트</h1>
        <p id="page-sub">필름 보관함 — 지금까지 신청하신 영상을 모아뒀어요.</p>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      목록을 불러오고 있어요…
    </div>

    <div id="empty">
      <div class="cinema">
        <div class="play-btn">▶</div>
        <h3>아직 상영할 필름이 없어요</h3>
        <p>첫 영상을 만들어보세요</p>
      </div>
      <div style="text-align:center;">
        <a class="btn-primary" href="./new.html">+ 새 영상 만들기</a>
      </div>
    </div>

    <div id="session-expired" style="display:none; text-align:center; padding:60px 20px;">
      <div class="cinema" style="max-width:340px; margin:0 auto 20px;">
        <div class="play-btn">🔒</div>
        <h3>로그인이 만료됐어요</h3>
        <p>세션이 끊겨서 목록을 못 가져왔어요. 다시 로그인해주세요.</p>
      </div>
      <button class="btn-primary" id="relogin-btn">다시 로그인하기</button>
    </div>

    <div id="project-list"></div>
  </div>

</main>

<script>
(() => {
  // ⚠️ n8n Webhook의 Production URL로 교체하세요 (Test URL 아님)
  const PROJECTS_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/my-projects';
  const GOOGLE_CLIENT_ID = '188637268860-9hj2af4bt8esn506bf5bqs72qnbu0qjs.apps.googleusercontent.com';

  const STATUS_LABEL = {
    '기획': '대본 준비 중',
    '대본검수대기': '대본 승인 대기',
    '장면구성중': '제작 중',
    '검수 대기': '최종 승인 대기',
    '검수완료': '마무리 중',
    '제작 중': '마무리 중',
    '배포': '완성됨',
  };

  function decodeJwt(token) {
    try {
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(json);
    } catch (e) { return null; }
  }

  function showSignedIn(profile) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('account-menu').style.display = 'block';
    document.getElementById('account-avatar').src = profile.picture || '';
    document.getElementById('account-avatar').alt = profile.name || '';
  }

  window.handleGoogleSignIn = function (response) {
    const data = decodeJwt(response.credential);
    if (!data) return;
    sessionStorage.setItem('rw_id_token', response.credential);
    showSignedIn(data);
    loadProjects(response.credential);
  };

  function renderProjects(projects) {
    document.getElementById('loading').style.display = 'none';
    if (!projects || projects.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    const list = document.getElementById('project-list');
    list.style.display = 'block';
    list.innerHTML = projects.map(p => {
      const hasError = p.errorLog ? '1' : '0';
      const label = hasError === '1' ? '문제 발생' : (STATUS_LABEL[p.status] || p.status || '-');
      const meta = hasError === '1'
        ? `<span class="err">${escapeHtml(p.errorLog)}</span>`
        : `${escapeHtml(p.form || '쇼츠')} · ${escapeHtml(p.createdAt || '')}`;
      return `
        <a class="reel-row" href="./project.html?id=${encodeURIComponent(p.id)}" data-status="${escapeHtml(p.status)}" data-error="${hasError}">
          <div class="reel-edge"></div>
          <div class="reel-icon">▶</div>
          <div class="reel-body">
            <div class="reel-title">${escapeHtml(p.title || '주제 준비 중')}</div>
            <div class="reel-meta">${meta}</div>
          </div>
          <div class="status-chip">${escapeHtml(label)}</div>
          <div class="reel-arrow">›</div>
        </a>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadProjects(idToken) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('session-expired').style.display = 'none';
    document.getElementById('project-list').style.display = 'none';
    try {
      const res = await fetch(PROJECTS_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || (data && data.error)) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('session-expired').style.display = 'block';
        return;
      }
      renderProjects(data && data.projects ? data.projects : []);
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('session-expired').style.display = 'block';
    }
  }

  document.getElementById('relogin-btn').addEventListener('click', () => {
    sessionStorage.removeItem('rw_id_token');
    location.reload();
  });

  document.getElementById('account-trigger').addEventListener('click', () => {
    document.getElementById('account-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('account-menu');
    if (menu && !menu.contains(e.target)) document.getElementById('account-dropdown').classList.remove('open');
  });
  document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('rw_id_token');
    location.reload();
  });

  function init() {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window.handleGoogleSignIn });
      google.accounts.id.renderButton(document.getElementById('gsi-area'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });

      const saved = sessionStorage.getItem('rw_id_token');
      if (saved) {
        const profile = decodeJwt(saved);
        if (profile) {
          showSignedIn(profile);
          loadProjects(saved);
          return;
        }
      }
      google.accounts.id.prompt();
    } else {
      setTimeout(init, 200);
    }
  }
  init();
})();
</script>

</body>
</html>
