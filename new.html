<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 영상 만들기 — 리와인드</title>
<link rel="icon" type="image/png" href="./리와인드_로고1_512px.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0c0c0c; --bg-raised: #161616; --bg-input: #1c1c1c; --line: #2a2a2a;
    --ink: #f5f3ee; --ink-dim: #a8a49b; --ink-faint: #6f6b62;
    --gold: #c68a12; --on-gold: #14100a; --err: #c96a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
    height: 100vh; overflow: hidden;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; letter-spacing: -0.01em; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }

  #gate {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px;
  }
  #gate .logo { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; margin-bottom: 30px; }
  #gate .logo img { width: 30px; height: 30px; border-radius: 7px; }
  #gate h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 10px; }
  #gate p { color: var(--ink-dim); font-size: 0.95rem; max-width: 40ch; margin: 0 0 26px; }
  #gsi-area { display: flex; justify-content: center; }
  #gate .back-link { margin-top: 22px; color: var(--ink-faint); font-size: 0.85rem; text-decoration: none; }
  #gate .back-link:hover { color: var(--ink-dim); }

  #app { display: none; height: 100vh; }
  .shell { display: flex; height: 100%; }

  .sidebar { width: 230px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; }
  .sidebar .logo { display: flex; align-items: center; gap: 9px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.98rem; padding: 6px 6px 20px; }
  .sidebar .logo img { width: 22px; height: 22px; border-radius: 5px; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--gold); color: var(--on-gold); border: none; border-radius: 6px;
    padding: 10px 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; margin-bottom: 18px;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 6px;
    font-size: 0.88rem; color: var(--ink-dim); cursor: pointer; text-decoration: none; background: none; border: none; width: 100%; text-align: left;
  }
  .side-item:hover { background: var(--bg-raised); color: var(--ink); }
  .side-item.active { background: var(--bg-raised); color: var(--ink); font-weight: 500; }
  .side-item .soon { margin-left: auto; font-size: 0.68rem; color: var(--ink-faint); border: 1px solid var(--line); padding: 1px 6px; border-radius: 8px; }
  .side-group-gap { height: 14px; }
  .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
  .account-row { display: flex; align-items: center; gap: 9px; padding: 8px 6px; font-size: 0.84rem; color: var(--ink-dim); }
  .account-row img { width: 22px; height: 22px; border-radius: 50%; }
  .account-row .logout { margin-left: auto; background: none; border: none; color: var(--ink-faint); font-size: 0.78rem; cursor: pointer; text-decoration: underline; }

  .main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .main::before {
    content: ""; position: absolute; top: -10%; right: -8%; width: 50%; height: 40%;
    background: radial-gradient(circle, color-mix(in srgb, var(--gold) 7%, transparent), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .main > * { position: relative; z-index: 1; }
  .main-top { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px 24px 0; position: relative; flex-wrap: wrap; }
  .direct-toggle-link { background: none; border: none; color: var(--ink-faint); font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0; }
  .direct-toggle-link:hover { color: var(--ink-dim); }

  .direct-form-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .direct-form-inner { width: 100%; max-width: 560px; padding: 20px 24px 30px; }
  .df-head { text-align: center; margin-bottom: 22px; }
  .df-head h2 { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 600; margin: 0 0 6px; }
  .df-head p { color: var(--ink-faint); font-size: 0.85rem; margin: 0; }
  .df-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .df-tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--ink-dim); cursor: pointer; font-size: 0.86rem; }
  .df-tab.active { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg-raised)); }
  .df-field { margin-bottom: 16px; }
  .df-field label { display: block; font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 6px; }
  .df-field input, .df-field select, .df-field textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; font-family: inherit;
  }
  .df-field textarea { resize: vertical; min-height: 64px; }
  .df-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .df-grid2 { grid-template-columns: 1fr; } }
  .df-price { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--bg-raised); text-align: center; margin: 18px 0; }
  .df-price .amt { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--gold); font-weight: 600; }
  .df-price p { margin: 4px 0 0; font-size: 0.78rem; color: var(--ink-faint); }
  .mode-badge {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font-size: 0.86rem; color: var(--ink-dim); background: var(--bg-raised);
    cursor: pointer; margin-bottom: 6px; font-family: inherit; text-align: left;
  }
  .mode-badge:hover { border-color: var(--ink-faint); }
  .mode-badge.paid { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--gold); }
  .mode-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .mode-badge.paid .dot { background: var(--gold); }
  #to-direct-form { margin-bottom: 4px; }

  .top-mode-bar { padding: 14px 20px 0; }
  .top-mode-badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px;
    font-size: 0.95rem; font-weight: 500; color: var(--ink-dim); background: var(--bg-raised);
    cursor: pointer; font-family: inherit;
  }
  .top-mode-badge:hover { border-color: var(--ink-faint); }
  .top-mode-badge.paid { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--gold); }
  .top-mode-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .top-mode-badge.paid .dot { background: var(--gold); }

  .chat-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .chat-inner { width: 100%; max-width: 640px; padding: 24px 24px 12px; }

  .msg { display: flex; gap: 9px; max-width: 92%; margin-bottom: 16px; animation: msg-in 0.28s ease both; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; margin-left: auto; }
  .msg .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(150deg, #e0ac2e, var(--gold) 60%, #8a5f0a);
    box-shadow: 0 0 0 1px rgba(198,138,18,0.25), 0 2px 6px rgba(198,138,18,0.35);
    color: var(--on-gold); display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700;
  }
  .msg.user .avatar { visibility: hidden; width: 0; }
  .msg .bubble { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 14px; padding: 11px 15px; font-size: 0.94rem; color: var(--ink); max-width: 460px; }
  .msg.user .bubble { background: var(--gold); color: var(--on-gold); border-color: transparent; }
  .msg.user { justify-content: flex-end; }

  .example-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 20px; }
  .example-chip {
    background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 8px 14px; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .example-chip:hover { transform: translateY(-1px); border-color: var(--gold-dim, var(--gold)); color: var(--ink); }
  .example-chip:hover { border-color: var(--gold); color: var(--ink); }

  .composer { border-top: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: center; }
  .composer-inner { width: 100%; max-width: 640px; }
  .chat-text-row { display: flex; gap: 8px; }
  .chat-text-row input {
    flex: 1; background: var(--bg-input); border: 1px solid var(--line); color: var(--ink);
    padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; font-family: inherit;
  }
  .chat-text-row input:focus { outline: 1px solid var(--gold); }
  .chat-send-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--on-gold);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; flex-shrink: 0;
  }
  .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .thinking { display: flex; align-items: center; gap: 8px; color: var(--ink-faint); font-size: 0.85rem; padding: 4px 2px; }
  .thinking .dots { display: flex; gap: 3px; }
  .thinking .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: think-bounce 1.1s ease-in-out infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes think-bounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .thinking .dots span { animation: none; opacity: 0.7; } }

  .summary-card { background: var(--bg-input); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 8px; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--ink-faint); flex-shrink: 0; }
  .summary-row .v { color: var(--ink); text-align: right; }
  .confirm-consent { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0; font-size: 0.82rem; color: var(--ink-dim); }
  .confirm-consent a { color: var(--gold); }
  .confirm-actions { display: flex; gap: 10px; }
  .btn-gold-sm { flex: 1; background: var(--gold); color: var(--on-gold); border: none; border-radius: 6px; padding: 11px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; }
  .btn-gold-sm:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-line-sm { border: 1px solid var(--line); color: var(--ink-dim); background: none; border-radius: 6px; padding: 11px 16px; font-size: 0.9rem; cursor: pointer; }

  .form-status { text-align: center; font-size: 0.85rem; padding: 6px 24px 0; min-height: 1.2em; }
  .form-status.err { color: var(--err); }
  .form-status.ok { color: var(--gold); }

  #soon-toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 18px; font-size: 0.86rem; color: var(--ink-dim); opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; z-index: 100;
  }
  #soon-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) { .sidebar { display: none; } }
</style>
</head>
<body>

<div id="gate">
  <div class="logo"><img src="./리와인드_로고1_512px.png" alt=""> 리와인드</div>
  <h1>로그인하고 시작하세요</h1>
  <p>영상 제작을 시작하려면 구글 계정 로그인이 필요해요. 신청 확인, 완성 알림 모두 이 계정으로 안내드려요.</p>
  <div id="gsi-area"></div>
  <a class="back-link" href="./index.html">← 돌아가기</a>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="logo"><img src="./리와인드_로고1_512px.png" alt=""> 리와인드</div>
      <button class="new-chat-btn" id="new-chat-btn">+ 새로 만들기</button>
      <button class="mode-badge" id="mode-badge" title="눌러서 체험/정식 전환"><span class="dot"></span> <span id="mode-label">체험 모드 · 무료 3회</span></button>
      <button class="side-item" id="to-direct-form">✏️ 직접 설정하기</button>
      <div class="side-group-gap"></div>
      <a class="side-item active" href="./new.html">🏠 홈</a>
      <a class="side-item" href="./dashboard.html">🎞️ 내 프로젝트</a>
      <div class="side-group-gap"></div>
      <button class="side-item soon-btn">🤖 에이전트 <span class="soon">준비 중</span></button>
      <button class="side-item soon-btn">🧩 앱 <span class="soon">준비 중</span></button>
      <button class="side-item soon-btn">🔀 워크플로우 <span class="soon">준비 중</span></button>
      <button class="side-item soon-btn">🎨 브랜드 <span class="soon">준비 중</span></button>
      <div class="sidebar-footer">
        <button class="side-item soon-btn">⚙️ 설정 <span class="soon">준비 중</span></button>
        <div class="account-row">
          <img id="account-avatar" src="" alt="">
          <span id="account-name"></span>
          <button class="logout" id="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="top-mode-bar">
        <button class="top-mode-badge" id="top-mode-badge" title="눌러서 체험/정식 전환"><span class="dot"></span> <span id="top-mode-label">체험 모드</span></button>
      </div>
      <div class="chat-wrap">
        <div class="chat-inner" id="chat-log">
          <div class="example-row" id="example-row">
            <button class="example-chip" data-topic="우리 카페의 신메뉴 딸기라떼를 20대에게 홍보하고 싶어요">☕ 카페 신메뉴 홍보</button>
            <button class="example-chip" data-topic="반려동물 영양제를 소개하는 영상을 만들고 싶어요">🐾 반려동물 용품</button>
            <button class="example-chip" data-topic="환절기 감기 예방을 위한 건강 정보를 알려주는 영상">🩺 건강정보</button>
            <button class="example-chip" data-topic="20년지기 친구들과 다녀온 제주도 여행 추억을 담은 영상">🎞️ 추억 영상</button>
          </div>
        </div>
      </div>

      <div class="direct-form-wrap" id="direct-form-wrap" style="display:none;"></div>

      <div class="composer">
        <div class="composer-inner" id="composer-inner"></div>
      </div>
      <p class="form-status" id="form-status"></p>
    </div>
  </div>
</div>

<div id="soon-toast">이 기능은 아직 준비 중이에요.</div>

<script>
(() => {
  const WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/web-request';
  const CONSULT_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/order-consult';
  const PROJECTS_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/my-projects';
  const GOOGLE_CLIENT_ID = '188637268860-9hj2af4bt8esn506bf5bqs72qnbu0qjs.apps.googleusercontent.com';

  let googleIdToken = null;
  let pastProjects = [];
  const params = new URLSearchParams(location.search);
  let planMode = params.get('mode') === 'paid' ? 'paid' : 'trial';

  const FIELD_LABEL = {
    topic: '주제', productLink: '제품 링크', target: '타겟', form: '영상 형태', tempo: '말하기 속도',
    voiceGender: '목소리', voiceAge: '목소리 연령대', directorNote: '연출 메모',
    driveLink: '드라이브 링크', mediaNote: '분위기 메모',
    sceneCount: '장면 수', videoLength: '영상 길이', estimatedPrice: '예상 비용', hookText: '화면 상단 문구'
  };

  function decodeJwt(token) {
    try {
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(json);
    } catch (e) { return null; }
  }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderReply(text) {
    // 이스케이프 먼저, 그 다음 **강조** 표시만 안전하게 <strong>으로 변환 (그 외 마크다운은 무시)
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  const badge = document.getElementById('mode-badge');
  const modeLabel = document.getElementById('mode-label');
  const topBadge = document.getElementById('top-mode-badge');
  const topModeLabel = document.getElementById('top-mode-label');
  function updateModeBadge() {
    if (planMode === 'paid') {
      badge.classList.add('paid'); modeLabel.textContent = '정식 모드 · 결제 안내가 이메일로 갑니다 (누르면 체험으로)';
      topBadge.classList.add('paid'); topModeLabel.textContent = '정식 모드';
    } else {
      badge.classList.remove('paid'); modeLabel.textContent = '체험 모드 · 무료 3회 (누르면 정식으로)';
      topBadge.classList.remove('paid'); topModeLabel.textContent = '체험 모드 · 무료 3회';
    }
  }
  updateModeBadge();
  badge.addEventListener('click', () => { planMode = planMode === 'paid' ? 'trial' : 'paid'; updateModeBadge(); });
  topBadge.addEventListener('click', () => { planMode = planMode === 'paid' ? 'trial' : 'paid'; updateModeBadge(); });

  const chatLog = document.getElementById('chat-log');
  const composer = document.getElementById('composer-inner');
  const exampleRow = document.getElementById('example-row');

  let mode = null;
  let answers = {};
  let history = [];

  function addMsg(role, html) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.innerHTML = `<div class="avatar">R</div><div class="bubble">${html}</div>`;
    chatLog.appendChild(el);
    chatLog.parentElement.scrollTop = chatLog.parentElement.scrollHeight;
    return el;
  }

  function renderComposer() {
    composer.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'chat-text-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '편하게 이야기해보세요';
    input.id = 'chat-text-field';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('name', 'rewind-chat-msg-' + Date.now()); // 브라우저가 이전 입력값을 이 필드와 연결해 기억하지 못하도록 매번 다른 이름 사용
    const send = document.createElement('button');
    send.className = 'chat-send-btn';
    send.textContent = '→';
    send.disabled = true;
    input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim()) go(input.value.trim()); });
    send.addEventListener('click', () => { if (input.value.trim()) go(input.value.trim()); });
    row.appendChild(input); row.appendChild(send);
    composer.appendChild(row);
    setTimeout(() => input.focus(), 50);
    function go(text) { sendMessage(text); }
  }

  async function sendMessage(text) {
    exampleRow.style.display = 'none';
    addMsg('user', escapeHtml(text));
    history.push({ role: 'user', text });
    composer.innerHTML = '<div class="thinking">생각하고 있어요 <span class="dots"><span></span><span></span><span></span></span></div>';
    try {
      const res = await fetch(CONSULT_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: googleIdToken, history, message: text, pastProjects, collected: answers, mode })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok === false) throw new Error(`요청 실패 (status: ${res.status}, ok: ${res.ok}, data: ${JSON.stringify(data)})`);
      if (data.mode) mode = data.mode;
      if (data.collected) Object.assign(answers, data.collected);
      if (data.reply) { addMsg('bot', renderReply(data.reply)); history.push({ role: 'bot', text: data.reply }); }
      const 필수충족 = mode === 'media' ? !!answers.driveLink : !!(answers.topic && answers.form);
      if (data.complete && 필수충족) {
        showSummary();
      } else {
        if (data.complete && !필수충족) console.warn('[전체 상담 Agent] complete:true였지만 필수 항목 누락 - 계속 진행', answers);
        renderComposer();
      }
    } catch (e) {
      console.error('[전체 상담 Agent 호출 실패]', e);
      addMsg('bot', '죄송해요, 잠시 문제가 있었어요. 다시 한번 말씀해주시겠어요?');
      renderComposer();
    }
  }

  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.topic));
  });

  const LEN_LIMITS = { topic: 300, directorNote: 500, mediaNote: 500, hookText: 18 };
  function clampAnswersAndWarn() {
    const truncated = [];
    Object.keys(LEN_LIMITS).forEach(key => {
      const limit = LEN_LIMITS[key];
      const val = answers[key];
      if (val && val.length > limit) {
        answers[key] = val.slice(0, limit);
        truncated.push(`${FIELD_LABEL[key] || key}(${limit}자)`);
      }
    });
    if (truncated.length) {
      addMsg('bot', `참고로 ${truncated.join(', ')}가 글자수 제한을 넘어서 앞부분만 반영했어요.`);
    }
  }

  function showSummary() {
    clampAnswersAndWarn();
    const rows = Object.keys(answers)
      .filter(k => answers[k])
      .map(k => `<div class="summary-row"><span class="k">${FIELD_LABEL[k] || k}</span><span class="v">${escapeHtml(String(answers[k])).slice(0, 60)}</span></div>`)
      .join('');
    addMsg('bot', `이렇게 만들어드릴게요.<div class="summary-card">${rows || '<div class="summary-row"><span class="k">확인된 내용이 없어요</span></div>'}</div>`);

    composer.innerHTML = '';
    const consentWrap = document.createElement('div');
    consentWrap.className = 'confirm-consent';
    consentWrap.innerHTML = `
      <input type="checkbox" id="terms-consent" style="margin-top:3px;">
      <label for="terms-consent"><a href="./terms.html" target="_blank">이용약관 및 개인정보 처리방침</a>에 동의합니다.${mode === 'media' ? ' 업로드 원본은 구글 드라이브에 보관되며, 무료체험 후 24시간 안에 결제가 확인되지 않으면 시스템의 분석 정보는 자동 삭제됩니다.' : ''}</label>`;
    composer.appendChild(consentWrap);

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-gold-sm';
    confirmBtn.textContent = '네, 만들어주세요';
    confirmBtn.disabled = true;
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-line-sm';
    editBtn.textContent = '더 이야기할게요';
    editBtn.addEventListener('click', renderComposer);
    actions.appendChild(confirmBtn); actions.appendChild(editBtn);
    composer.appendChild(actions);

    const consentBox = consentWrap.querySelector('#terms-consent');
    consentBox.addEventListener('change', () => { confirmBtn.disabled = !consentBox.checked; });
    confirmBtn.addEventListener('click', doSubmit);
  }

  async function doSubmit() {
    const status = document.getElementById('form-status');
    status.textContent = ''; status.className = 'form-status';
    const profile = decodeJwt(googleIdToken);
    const payload = { name: (profile && profile.name) || '', contact: (profile && profile.email) || '', idToken: googleIdToken, termsConsent: true, mode: mode || 'topic' };

    if (mode === 'media') {
      payload.driveLink = answers.driveLink || '';
      if (answers.mediaNote) payload.mediaNote = answers.mediaNote;
      if (answers.voiceGender) payload.voiceGender = answers.voiceGender;
      if (answers.voiceAge) payload.voiceAge = answers.voiceAge;
    } else {
      payload.topic = answers.topic || '';
      payload.form = answers.form || '쇼츠';
      if (answers.productLink) payload.productLink = answers.productLink;
      if (answers.target) payload.target = answers.target;
      if (answers.tempo) payload.tempo = answers.tempo;
      if (answers.voiceGender) payload.voiceGender = answers.voiceGender;
      if (answers.voiceAge) payload.voiceAge = answers.voiceAge;
      if (answers.directorNote) payload.directorNote = answers.directorNote;
    }
    if (answers.hookText) payload.hookText = answers.hookText;
    if (answers.sceneCount) payload.sceneCount = answers.sceneCount;
    if (answers.videoLength) payload.videoLength = answers.videoLength;
    if (answers.estimatedPrice) payload.estimatedPrice = answers.estimatedPrice;

    try {
      const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json().catch(() => null);
      if (!res.ok || (data && data.ok === false)) throw new Error((data && data.message) || '요청이 거부됐어요.');
      addMsg('bot', '접수됐어요! 지금 만들어지는 과정을 바로 보여드릴게요.');
      composer.innerHTML = '';
      const newId = data && data.id;
      setTimeout(() => { location.href = newId ? ('./project.html?id=' + encodeURIComponent(newId)) : './dashboard.html'; }, 1400);
    } catch (err) {
      status.textContent = err.message || '접수 중 문제가 생겼어요.';
      status.className = 'form-status err';
    }
  }

  function resetChat() {
    mode = null; answers = {}; history = [];
    chatLog.innerHTML = '';
    chatLog.appendChild(exampleRow);
    exampleRow.style.display = 'flex';
    document.getElementById('form-status').textContent = '';

    const name = (document.getElementById('account-name').textContent || '').split(' ')[0];
    const pendingList = pastProjects.filter(p => p.status !== '배포' && !p.videoUrl); // 아직 안 끝난 프로젝트들
    const pending = pendingList[0];

    if (pending) {
      exampleRow.style.display = 'none';
      const greeting = (name ? `안녕하세요, ${escapeHtml(name)}님! ` : '안녕하세요! ') +
        (pendingList.length > 1
          ? `아직 진행 중인 프로젝트가 ${pendingList.length}개 있으시네요. `
          : `아직 진행 중인 프로젝트가 있으시네요 — "${escapeHtml(pending.title || '제목 준비 중')}" (현재 단계: ${escapeHtml(pending.status || '-')}). `) +
        '내 프로젝트에서 이어서 확인하시겠어요, 아니면 새로운 영상을 만드실까요?';
      addMsg('bot', greeting);
      composer.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'chat-text-row';
      row.style.gap = '10px';
      const btnCheck = document.createElement('a');
      btnCheck.className = 'chat-send-btn';
      btnCheck.style.cssText = 'width:auto; border-radius:8px; padding:11px 18px; font-size:0.86rem; text-decoration:none; white-space:nowrap;';
      btnCheck.textContent = '내 프로젝트 보기';
      btnCheck.href = './dashboard.html';
      const btnNew = document.createElement('button');
      btnNew.className = 'chat-send-btn';
      btnNew.style.cssText = 'width:auto; background:var(--bg-input); color:var(--ink-dim); border:1px solid var(--line); border-radius:8px; padding:11px 18px; font-size:0.86rem; white-space:nowrap;';
      btnNew.textContent = '새로 만들기';
      btnNew.addEventListener('click', () => { exampleRow.style.display = 'flex'; addMsg('user', '새로 만들기'); addMsg('bot', '좋아요! 어떤 영상을 만들어드릴까요? 위 예시를 눌러보셔도 좋아요.'); renderComposer(); });
      row.appendChild(btnCheck); row.appendChild(btnNew);
      composer.appendChild(row);
      return;
    }

    let greeting;
    if (pastProjects.length === 0) {
      greeting = (name ? `안녕하세요, ${escapeHtml(name)}님! ` : '안녕하세요! ') +
        '리와인드에 처음 오셨네요. 주제 하나만 말씀해주시면 대본부터 목소리, 장면까지 AI가 전부 만들어드려요. ' +
        '어떤 걸 만들어드릴까요? 위 예시를 눌러보셔도 좋고, 항목을 직접 하나씩 고르고 싶으시면 위쪽 "직접 설정하기"를 눌러주세요.';
    } else {
      const last = pastProjects[0];
      greeting = `다시 오셨네요! ${last && last.title ? `지난번 "${escapeHtml(last.title)}" 이후로 ` : ''}이번엔 어떤 영상을 만들어볼까요?`;
    }
    addMsg('bot', greeting);
    renderComposer();
  }
  document.getElementById('new-chat-btn').addEventListener('click', resetChat);

  const toast = document.getElementById('soon-toast');
  document.querySelectorAll('.soon-btn').forEach(btn => {
    btn.addEventListener('click', () => { toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); });
  });

  document.getElementById('logout-btn').addEventListener('click', () => { sessionStorage.removeItem('rw_id_token'); location.reload(); });

  /* ===================== 직접 설정하기 (채팅 대신 폼으로) ===================== */
  function computePrice(lengthMin, sceneCount) {
    let price = 3000 + (lengthMin * 1500) + (sceneCount * 1200);
    if (lengthMin > 60) price = Math.round(price * 1.2);
    return Math.round(price);
  }

  let dfMode = 'topic';

  function showDirectForm() {
    document.getElementById('chat-log').parentElement.style.display = 'none';
    document.getElementById('composer-inner').parentElement.style.display = 'none';
    const wrap = document.getElementById('direct-form-wrap');
    wrap.style.display = 'flex';
    renderDirectForm();
  }
  function showChatFromDirectForm() {
    document.getElementById('direct-form-wrap').style.display = 'none';
    document.getElementById('chat-log').parentElement.style.display = 'flex';
    document.getElementById('composer-inner').parentElement.style.display = 'flex';
  }
  document.getElementById('to-direct-form').addEventListener('click', showDirectForm);

  function ageOptions() {
    return ['자동','10~20대','20~30대','30~40대','40~50대','50~60대','60대 이상']
      .map(v => `<option value="${v === '자동' ? '' : v}">${v}</option>`).join('');
  }

  function renderDirectForm() {
    const wrap = document.getElementById('direct-form-wrap');
    const isMedia = dfMode === 'media';
    wrap.innerHTML = `
      <div class="direct-form-inner">
        <div class="df-head">
          <h2>직접 설정하기</h2>
          <p>항목을 골라서 바로 채워보세요. 비워두시면 AI가 알아서 정해드려요.</p>
        </div>
        <div class="df-tabs">
          <button class="df-tab ${!isMedia ? 'active' : ''}" id="df-tab-topic">✍️ 주제로 만들기</button>
          <button class="df-tab ${isMedia ? 'active' : ''}" id="df-tab-media">📁 내 드라이브 자료로</button>
        </div>
        <div id="df-fields"></div>
        <div class="df-price">
          <div class="amt" id="df-price-amt">약 -</div>
          <p>선택하신 내용 기준 예상 비용 (실제 확정은 다음 화면에서)</p>
        </div>
        <div class="confirm-actions">
          <button class="btn-line-sm" id="df-cancel">채팅으로 돌아가기</button>
          <button class="btn-gold-sm" id="df-confirm">이 내용으로 확인하기</button>
        </div>
      </div>`;

    const fieldsEl = document.getElementById('df-fields');
    if (isMedia) {
      fieldsEl.innerHTML = `
        <div class="df-field"><label>구글 드라이브 폴더 링크 *</label><input type="url" id="df-driveLink" placeholder="https://drive.google.com/drive/folders/..."></div>
        <div class="df-field"><label>어떤 이야기·분위기로 만들지 (선택, 500자)</label><textarea id="df-mediaNote" maxlength="500"></textarea></div>
        <div class="df-grid2">
          <div class="df-field"><label>목소리</label><select id="df-voiceGender"><option value="">자동</option><option value="여성">여성</option><option value="남성">남성</option></select></div>
          <div class="df-field"><label>목소리 연령대</label><select id="df-voiceAge">${ageOptions()}</select></div>
        </div>`;
    } else {
      fieldsEl.innerHTML = `
        <div class="df-field"><label>주제 * (300자)</label><textarea id="df-topic" maxlength="300" placeholder="예: LG 통돌이 17kg DD모터 인공지능 세탁기 (T17DX3) 소개"></textarea></div>
        <div class="df-field"><label>제품 링크 (선택)</label><input type="url" id="df-productLink" placeholder="https://..."></div>
        <div class="df-grid2">
          <div class="df-field"><label>영상 형태 *</label><select id="df-form"><option value="쇼츠">쇼츠(세로·짧게)</option><option value="롱폼">롱폼(가로·길게)</option></select></div>
          <div class="df-field"><label>타겟 연령대</label><select id="df-target">${ageOptions()}</select></div>
          <div class="df-field"><label>말하기 속도</label><select id="df-tempo"><option value="">자동</option><option value="차분">차분하게</option><option value="중간">보통</option><option value="빠름">빠르고 경쾌하게</option></select></div>
          <div class="df-field"><label>목소리</label><select id="df-voiceGender"><option value="">자동</option><option value="여성">여성</option><option value="남성">남성</option></select></div>
          <div class="df-field"><label>목소리 연령대</label><select id="df-voiceAge">${ageOptions()}</select></div>
          <div class="df-field"><label>화면 상단 문구 (선택, 18자)</label><input type="text" id="df-hookText" maxlength="18"></div>
        </div>
        <div class="df-field"><label>영상 길이(분, 선택)</label><input type="number" id="df-videoLength" min="0" step="0.1" placeholder="비워두면 대본 길이에 맞게 자동"></div>
        <div class="df-field"><label>장면 수(선택)</label><input type="number" id="df-sceneCount" min="1" step="1" placeholder="비워두면 자동"></div>
        <div class="df-field"><label>꼭 넣고 싶은 연출 (선택, 500자)</label><textarea id="df-directorNote" maxlength="500"></textarea></div>`;
    }

    function updatePrice() {
      const form = document.getElementById('df-form');
      const lenInput = document.getElementById('df-videoLength');
      const sceneInput = document.getElementById('df-sceneCount');
      const isLongform = form && form.value === '롱폼';
      const len = lenInput && lenInput.value ? parseFloat(lenInput.value) : (isLongform ? 3 : 0.75);
      const scenes = sceneInput && sceneInput.value ? parseInt(sceneInput.value) : (isLongform ? 15 : 8);
      document.getElementById('df-price-amt').textContent = '약 ' + computePrice(len, scenes).toLocaleString() + '원';
    }
    wrap.addEventListener('input', updatePrice);
    wrap.addEventListener('change', updatePrice);
    updatePrice();

    document.getElementById('df-tab-topic').addEventListener('click', () => { dfMode = 'topic'; renderDirectForm(); });
    document.getElementById('df-tab-media').addEventListener('click', () => { dfMode = 'media'; renderDirectForm(); });
    document.getElementById('df-cancel').addEventListener('click', showChatFromDirectForm);
    document.getElementById('df-confirm').addEventListener('click', () => {
      const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      if (isMedia) {
        if (!val('df-driveLink')) { alert('드라이브 링크를 입력해주세요.'); return; }
        answers = { driveLink: val('df-driveLink') };
        if (val('df-mediaNote')) answers.mediaNote = val('df-mediaNote');
      } else {
        if (!val('df-topic')) { alert('주제를 입력해주세요.'); return; }
        answers = { topic: val('df-topic'), form: document.getElementById('df-form').value || '쇼츠' };
        if (val('df-productLink')) answers.productLink = val('df-productLink');
        if (val('df-target')) answers.target = val('df-target');
        if (val('df-tempo')) answers.tempo = val('df-tempo');
        if (val('df-hookText')) answers.hookText = val('df-hookText');
        if (val('df-videoLength')) answers.videoLength = val('df-videoLength');
        if (val('df-sceneCount')) answers.sceneCount = val('df-sceneCount');
        if (val('df-directorNote')) answers.directorNote = val('df-directorNote');
      }
      if (val('df-voiceGender')) answers.voiceGender = val('df-voiceGender');
      if (val('df-voiceAge')) answers.voiceAge = val('df-voiceAge');
      const lenForPrice = answers.videoLength ? parseFloat(answers.videoLength) : (answers.form === '롱폼' ? 3 : 0.75);
      const sceneForPrice = answers.sceneCount ? parseInt(answers.sceneCount) : (answers.form === '롱폼' ? 15 : 8);
      answers.estimatedPrice = computePrice(lenForPrice, sceneForPrice);
      mode = isMedia ? 'media' : 'topic';

      showChatFromDirectForm();
      addMsg('user', '직접 설정하기로 내용을 채웠어요.');
      showSummary();
    });
  }


  async function enterApp(idToken) {
    const profile = decodeJwt(idToken);
    if (!profile) return;
    googleIdToken = idToken;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('account-avatar').src = profile.picture || '';
    document.getElementById('account-name').textContent = profile.name || profile.email || '';
    await loadPastProjects(idToken);
    resetChat();
  }

  async function loadPastProjects(idToken) {
    try {
      const res = await fetch(PROJECTS_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        console.error('[내 프로젝트 목록 조회 실패]', 'status:', res.status, 'data:', data);
      }
      pastProjects = (data && data.projects) || [];
      console.log('[내 프로젝트 목록 조회] 가져온 개수:', pastProjects.length, pastProjects);
    } catch (e) {
      console.error('[내 프로젝트 목록 조회 실패 - 네트워크/예외]', e);
      pastProjects = [];
    }
  }
  window.handleGoogleSignIn = function (response) {
    sessionStorage.setItem('rw_id_token', response.credential);
    enterApp(response.credential);
  };
  function initGate() {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window.handleGoogleSignIn });
      google.accounts.id.renderButton(document.getElementById('gsi-area'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });
      const saved = sessionStorage.getItem('rw_id_token');
      if (saved) enterApp(saved);
    } else {
      setTimeout(initGate, 200);
    }
  }
  initGate();
})();
</script>

</body>
</html>
