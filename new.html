<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새 영상 만들기 — 리와인드</title>
<link rel="icon" type="image/png" href="./리와인드_로고1_512px.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0c0c0c; --bg-raised: #161616; --bg-input: #1c1c1c; --line: #2a2a2a;
    --ink: #f5f3ee; --ink-dim: #a8a49b; --ink-faint: #6f6b62;
    --gold: #c68a12; --on-gold: #14100a; --err: #c96a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
    height: 100vh; overflow: hidden;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; letter-spacing: -0.01em; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }

  #gate {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px;
  }
  #gate .logo { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; margin-bottom: 30px; }
  #gate .logo img { width: 30px; height: 30px; border-radius: 7px; }
  #gate h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 10px; }
  #gate p { color: var(--ink-dim); font-size: 0.95rem; max-width: 40ch; margin: 0 0 26px; }
  #gsi-area { display: flex; justify-content: center; }
  #gate .back-link { margin-top: 22px; color: var(--ink-faint); font-size: 0.85rem; text-decoration: none; }
  #gate .back-link:hover { color: var(--ink-dim); }

  #app { display: none; height: 100vh; }
  .shell { display: flex; height: 100%; }

  .sidebar { width: 230px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; }
  .sidebar .logo { display: flex; align-items: center; gap: 9px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.98rem; padding: 6px 6px 20px; }
  .sidebar .logo img { width: 22px; height: 22px; border-radius: 5px; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--gold); color: var(--on-gold); border: none; border-radius: 6px;
    padding: 10px 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; margin-bottom: 18px;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 6px;
    font-size: 0.88rem; color: var(--ink-dim); cursor: pointer; text-decoration: none; background: none; border: none; width: 100%; text-align: left;
  }
  .side-item:hover { background: var(--bg-raised); color: var(--ink); }
  .side-item.active { background: var(--bg-raised); color: var(--ink); font-weight: 500; }
  .side-item .soon { margin-left: auto; font-size: 0.68rem; color: var(--ink-faint); border: 1px solid var(--line); padding: 1px 6px; border-radius: 8px; }
  .side-group-gap { height: 14px; }
  .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
  .account-row { display: flex; align-items: center; gap: 9px; padding: 8px 6px; font-size: 0.84rem; color: var(--ink-dim); }
  .account-row img { width: 22px; height: 22px; border-radius: 50%; }
  .account-row .logout { margin-left: auto; background: none; border: none; color: var(--ink-faint); font-size: 0.78rem; cursor: pointer; text-decoration: underline; }

  .main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .split-row { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .chat-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .split-row.split-active .direct-form-wrap { display: flex !important; flex: 0 0 46%; border-right: none; }
  .split-resizer { display: none; width: 6px; flex: 0 0 6px; cursor: col-resize; background: var(--line); position: relative; }
  .split-resizer:hover, .split-resizer.dragging { background: var(--gold); }
  .split-row.split-active .split-resizer { display: block; }
  @media (max-width: 760px) { .split-row.split-active .direct-form-wrap { flex-basis: 100%; } .split-row.split-active .chat-column, .split-row.split-active .split-resizer { display: none; } }
  .main::before {
    content: ""; position: absolute; top: -10%; right: -8%; width: 50%; height: 40%;
    background: radial-gradient(circle, color-mix(in srgb, var(--gold) 7%, transparent), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .main > * { position: relative; z-index: 1; }
  .main-top { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px 24px 0; position: relative; flex-wrap: wrap; }
  .direct-toggle-link { background: none; border: none; color: var(--ink-faint); font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0; }
  .direct-toggle-link:hover { color: var(--ink-dim); }

  .direct-form-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .direct-form-wrap::-webkit-scrollbar { width: 6px; }
  .direct-form-wrap::-webkit-scrollbar-track { background: transparent; }
  .direct-form-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .direct-form-wrap::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  .direct-form-wrap { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .direct-form-inner { width: 100%; max-width: 560px; padding: 20px 24px 30px; }
  .df-head { text-align: center; margin-bottom: 22px; }
  .df-head h2 { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 600; margin: 0 0 6px; }
  .df-head p { color: var(--ink-faint); font-size: 0.85rem; margin: 0; }
  .df-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .df-tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--ink-dim); cursor: pointer; font-size: 0.86rem; }
  .df-tab.active { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg-raised)); }
  .df-field { margin-bottom: 16px; }
  .df-field label { display: block; font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 6px; }
  .df-field input, .df-field select, .df-field textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; font-family: inherit;
  }
  .df-field textarea { resize: vertical; min-height: 64px; }
  .df-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .df-grid2 { grid-template-columns: 1fr; } }
  .df-price { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--bg-raised); text-align: center; margin: 18px 0; }
  .df-price .amt { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--gold); font-weight: 600; }
  .df-price p { margin: 4px 0 0; font-size: 0.78rem; color: var(--ink-faint); }
  .mode-badge {
    display: flex; align-items: flex-start; gap: 8px; width: 100%;
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font-size: 0.86rem; color: var(--ink-dim); background: var(--bg-raised); line-height: 1.5;
    cursor: pointer; margin-bottom: 6px; font-family: inherit; text-align: left;
  }
  .mode-badge:hover { border-color: var(--ink-faint); }
  .mode-badge.paid { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--gold); }
  .mode-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; margin-top: 6px; }
  .mode-badge .hint { color: var(--ink-faint); font-size: 0.78rem; }
  .mode-badge.paid .dot { background: var(--gold); }
  #to-direct-form { margin-bottom: 4px; }

  .top-mode-bar { padding: 14px 20px 0; }
  .top-mode-badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px;
    font-size: 0.95rem; font-weight: 500; color: var(--ink-dim); background: var(--bg-raised);
    cursor: pointer; font-family: inherit;
  }
  .top-mode-badge:hover { border-color: var(--ink-faint); }
  .top-mode-badge.paid { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--gold); }
  .top-mode-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .top-mode-badge.paid .dot { background: var(--gold); }

  .chat-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .chat-inner { width: 100%; max-width: 640px; padding: 24px 24px 12px; }

  .msg { display: flex; gap: 9px; max-width: 92%; margin-bottom: 16px; animation: msg-in 0.28s ease both; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; margin-left: auto; }
  .msg .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(150deg, #e0ac2e, var(--gold) 60%, #8a5f0a);
    box-shadow: 0 0 0 1px rgba(198,138,18,0.25), 0 2px 6px rgba(198,138,18,0.35);
    color: var(--on-gold); display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700;
  }
  .msg.user .avatar { visibility: hidden; width: 0; }
  .msg .bubble { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 14px; padding: 11px 15px; font-size: 0.94rem; color: var(--ink); max-width: 460px; }
  .msg.user .bubble { background: var(--gold); color: var(--on-gold); border-color: transparent; }
  .msg.user { justify-content: flex-end; }

  .example-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 20px; }
  .example-chip {
    background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 8px 14px; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .example-chip:hover { transform: translateY(-1px); border-color: var(--gold-dim, var(--gold)); color: var(--ink); }
  .example-chip:hover { border-color: var(--gold); color: var(--ink); }

  .composer { border-top: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: center; }
  .composer-inner { width: 100%; max-width: 640px; }
  .chat-text-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-text-row textarea {
    flex: 1; background: var(--bg-input); border: 1px solid var(--line); color: var(--ink);
    padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; font-family: inherit;
    resize: none; overflow-y: auto; max-height: 120px; line-height: 1.4;
  }
  .chat-text-row textarea:focus { outline: 1px solid var(--gold); }
  .chat-send-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--on-gold);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; flex-shrink: 0;
  }
  .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .thinking { display: flex; align-items: center; gap: 8px; color: var(--ink-faint); font-size: 0.85rem; padding: 4px 2px; }
  .thinking .dots { display: flex; gap: 3px; }
  .thinking .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: think-bounce 1.1s ease-in-out infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes think-bounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .thinking .dots span { animation: none; opacity: 0.7; } }

  .summary-card { background: var(--bg-input); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 8px; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--ink-faint); flex-shrink: 0; }
  .summary-row .v { color: var(--ink); text-align: right; }
  .confirm-consent { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0; font-size: 0.82rem; color: var(--ink-dim); }
  .confirm-consent a { color: var(--gold); }
  .confirm-actions { display: flex; gap: 10px; }
  .btn-gold-sm { flex: 1; background: var(--gold); color: var(--on-gold); border: none; border-radius: 6px; padding: 11px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; }
  .btn-gold-sm:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-line-sm { border: 1px solid var(--line); color: var(--ink-dim); background: none; border-radius: 6px; padding: 11px 16px; font-size: 0.9rem; cursor: pointer; }

  .form-status { text-align: center; font-size: 0.85rem; padding: 6px 24px 0; min-height: 1.2em; }
  .form-status.err { color: var(--err); }
  .form-status.ok { color: var(--gold); }

  #price-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
  #price-modal-overlay.show { display: flex; }
  .price-modal { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; max-width: 420px; width: 92%; max-height: 80vh; overflow-y: auto; }
  .price-modal h2 { font-family: 'Fraunces', serif; font-size: 1.15rem; margin: 0 0 4px; }
  .price-modal .sub { color: var(--ink-faint); font-size: 0.82rem; margin: 0 0 18px; }
  .price-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .price-table th, .price-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  .price-table th { color: var(--ink-faint); font-weight: 500; font-size: 0.78rem; }
  .price-table td:last-child, .price-table th:last-child { text-align: right; color: var(--gold); font-weight: 600; }
  .price-modal .note { font-size: 0.76rem; color: var(--ink-faint); margin-top: 14px; line-height: 1.5; }
  .price-modal .close-row { text-align: right; margin-top: 18px; }
  #soon-toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 18px; font-size: 0.86rem; color: var(--ink-dim); opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; z-index: 100;
  }
  #soon-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) { .sidebar { display: none; } }

  /* ===== 디자인 v2 (필름 스튜디오) — 기존 규칙 위에 덮어쓰는 층. 아래만 지우면 이전 디자인으로 돌아감 ===== */
  :root, :root:not([data-theme="__v2"]), :root[data-theme] {
    color-scheme: dark;
    --bg: #14110f; --bg-raised: #1a1613; --bg-input: #221d19; --line: #2e2823; --film: #0f0d0b;
    --ink: #f2e9da; --ink-dim: #c9bfae; --ink-faint: #9a8f80;
    --amber: #e2a23c; --amber-dim: #5a4222; --amber-wash: #251d14; --olive: #c9a86a; --on-amber: #1a1410;
    --gold: #e2a23c; --gold-dim: #5a4222; --on-gold: #1a1410;
    --blue: #8cb4e0; --green: #a8c996; --err: #e08a7a; --focus: #e2a23c; --card-shadow: none;
    --status-plan: #8cb4e0; --status-making: #8cb4e0; --status-review: #e2a23c;
    --status-final: #8cb4e0; --status-done: #a8c996; --status-error: #e08a7a;
  }
  body { background: var(--bg); color: var(--ink); }
  h1, h2, h3, .display { font-family: 'IBM Plex Sans KR', -apple-system, sans-serif; font-weight: 700; letter-spacing: -0.03em; }
  .logo { font-family: 'IBM Plex Sans KR', -apple-system, sans-serif !important; font-weight: 700 !important; letter-spacing: -0.02em; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  ::selection { background: var(--amber); color: var(--on-amber); }
  .btn-primary, .btn-ghost { border-radius: 999px !important; padding: 12px 24px; font-weight: 600; transition: background-color .15s, border-color .15s, color .15s; }
  .btn-primary:hover { transform: none; box-shadow: none; background: #efb556; }
  .btn-ghost { border-color: #4a4038; color: var(--ink); }
  .btn-ghost:hover { border-color: var(--ink-faint); }
  header.shell { padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom-color: #2a241f; }
  .breadcrumb a:hover { color: var(--ink); }
  .spinner { border-top-color: var(--amber); }
  .sidebar { width: 244px; background: #171310; border-right-color: #2a241f; padding: 20px 14px; }
  .sidebar .logo { font-size: 1.05rem; }
  .new-chat-btn { border-radius: 999px; padding: 12px 16px; font-size: 0.92rem; justify-content: center; }
  .side-item { border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
  .side-item svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-item.active, .side-item:hover { background: #231e1a; }
  .side-item .soon { border-radius: 999px; }
  .mode-badge, .top-mode-badge { border-radius: 999px; }
  .mode-badge { border-radius: 14px; }
  .main::before { display: none; }

  .chat-inner, .composer-inner { max-width: 720px; }
  .chat-inner { padding-top: 32px; }
  .msg { margin-bottom: 22px; gap: 12px; }
  .msg .avatar { width: 32px; height: 32px; background: #2a241f; box-shadow: 0 0 0 1px #3a322b; color: var(--amber); font-size: 0.78rem; }
  .msg.bot .bubble { background: transparent; border: 0; padding: 4px 0 0; font-size: 1rem; line-height: 1.75; color: #e8dfcf; max-width: 600px; }
  .msg.user .bubble { background: #2e2519; color: var(--ink); border: 1px solid #4a3a25; border-radius: 20px 20px 6px 20px; padding: 12px 18px; font-size: 0.98rem; }
  .example-chip { border-radius: 999px; padding: 10px 18px; font-size: 0.9rem; border-color: #3a322b; color: var(--ink-dim); }
  .example-chip:hover { transform: none; border-color: var(--amber); color: var(--ink); }

  .composer { border-top: 0; padding: 12px 24px 22px; }
  .chat-text-row { background: var(--bg-raised); border: 1px solid #3a322b; border-radius: 24px; padding: 8px 8px 8px 18px; align-items: flex-end; }
  .chat-text-row:focus-within { border-color: var(--amber-dim); }
  .chat-text-row textarea { background: transparent; border: 0; padding: 10px 0; font-size: 1rem; }
  .chat-text-row textarea:focus { outline: none; }
  .chat-send-btn { width: 44px; height: 44px; }

  .direct-form-wrap { background: #171310; }
  .direct-form-inner { padding: 28px 32px 36px; }
  .df-head { text-align: left; }
  .df-head h2 { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: -0.02em; }
  .df-head p { font-size: 0.9rem; color: var(--ink-dim); }
  .df-tabs { background: var(--bg); border-radius: 14px; padding: 5px; gap: 6px; }
  .df-tab { border: 0; border-radius: 10px; background: transparent; min-height: 44px; font-size: 0.94rem; color: var(--ink-dim); }
  .df-tab.active { background: var(--ink); color: var(--bg); font-weight: 600; }
  .df-field label { font-size: 0.88rem; color: var(--ink-dim); font-weight: 500; }
  .df-field input, .df-field select, .df-field textarea { background: var(--bg); border-color: #3a322b; border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; min-height: 48px; }
  .df-field input:focus, .df-field select:focus, .df-field textarea:focus { outline: none; border-color: var(--amber); }
  .df-price { border-radius: 16px; background: var(--bg); }
  .df-price .amt { font-size: 1.6rem; }
  .split-resizer { background: #2a241f; width: 8px; flex-basis: 8px; }
  .split-resizer::after { content: ""; position: absolute; top: 50%; left: 2px; width: 4px; height: 44px; margin-top: -22px; border-radius: 2px; background: #4a4038; }

  .summary-card { border-radius: 16px; background: var(--bg-raised); padding: 16px 20px; }
  .summary-row { font-size: 0.92rem; }
  .btn-gold-sm, .btn-line-sm { border-radius: 999px; min-height: 48px; font-size: 0.95rem; }
  .btn-line-sm { border-color: #4a4038; color: var(--ink); }

</style>
</head>

      <button class="side-item" id="to-direct-form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg> 직접 설정하기</button>
      <button class="side-item" id="to-price-table"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.5h-3.5a1.5 1.5 0 0 0 0 3h2a1.5 1.5 0 0 1 0 3H9.5M12 7.5v1.5M12 15.5V17"/></svg> 요금 안내</button>
      <div class="side-group-gap"></div>
      <a class="side-item active" href="./new.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8h-5v-5h-6v5H4z"/></svg> 홈</a>
      <a class="side-item" href="./dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></svg> 내 프로젝트</a>

      <button class="side-item soon-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg> 앱 <span class="soon">준비 중</span></button>
      <button class="side-item soon-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h5a3 3 0 0 1 3 3v7"/></svg> 워크플로우 <span class="soon">준비 중</span></button>
      <button class="side-item soon-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-1.2-1-1.4-1-2.4 0-.9.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="8" r="1"/></svg> 브랜드 <span class="soon">준비 중</span></button>
      <div class="sidebar-footer">
        <button class="side-item soon-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1"/></svg> 설정 <span class="soon">준비 중</span></button>

                <button class="example-chip" data-topic="반려동물 영양제를 소개하는 영상을 만들고 싶어요">반려동물 용품</button>
                <button class="example-chip" data-topic="환절기 감기 예방을 위한 건강 정보를 알려주는 영상">건강정보</button>
                <button class="example-chip" data-topic="20년지기 친구들과 다녀온 제주도 여행 추억을 담은 영상">추억 영상</button>
              </div>

    <p class="sub">대략적인 참고용 예상 요금표예요. 실제 견적은 대본과 장면이 확정된 뒤 정확히 안내드려요.</p>

<script>
(() => {
  const WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/web-request';
  const CONSULT_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/order-consult';
  const PROJECTS_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/my-projects';
  const REVIEW_ACTION_WEBHOOK_URL = 'https://bald-buffalo.pikapod.net/webhook/review-action';
  const GOOGLE_CLIENT_ID = '188637268860-9hj2af4bt8esn506bf5bqs72qnbu0qjs.apps.googleusercontent.com';

  let googleIdToken = null;
  let pastProjects = [];
  const params = new URLSearchParams(location.search);
  let planMode = params.get('mode') === 'paid' ? 'paid' : 'trial';

  const FIELD_LABEL = {
    topic: '주제', productLink: '제품 링크', productImageUrl: '제품 이미지', target: '타겟', form: '영상 형태', tempo: '말하기 속도',
    voiceGender: '목소리', voiceAge: '목소리 연령대', directorNote: '연출 메모', style: '연출 스타일', characterUse: '캐릭터 통일',
    driveLink: '드라이브 링크', mediaNote: '분위기 메모',
    sceneCount: '장면 수', videoLength: '영상 길이', estimatedPrice: '예상 비용', hookText: '화면 상단 문구'
  };

  function decodeJwt(token) {
    try {
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(json);
    } catch (e) { return null; }
  }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderReply(text) {
    // 이스케이프 먼저, 그 다음 **강조** 표시만 안전하게 <strong>으로 변환 (그 외 마크다운은 무시)
    // 줄바꿈(\n)은 실제 <br>로 바꿔서, 1. 2. 3. 같은 번호 목록이 한 줄로 뭉치지 않고 줄마다 보이게 한다.
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  }

  const badge = document.getElementById('mode-badge');
  const modeLabel = document.getElementById('mode-label');
  const topBadge = document.getElementById('top-mode-badge');
  const topModeLabel = document.getElementById('top-mode-label');
  function updateModeBadge() {
    if (planMode === 'paid') {
      badge.classList.add('paid'); modeLabel.innerHTML = '정식 모드 · 결제 안내가 이메일로 갑니다<br><span class="hint">(누르면 체험으로)</span>';
      topBadge.classList.add('paid'); topModeLabel.textContent = '정식 모드';
    } else {
      badge.classList.remove('paid'); modeLabel.innerHTML = '체험 모드 · 무료 3회<br><span class="hint">(누르면 정식으로)</span>';
      topBadge.classList.remove('paid'); topModeLabel.textContent = '체험 모드 · 무료 3회';
    }
  }
  updateModeBadge();
  function updatePrice() {
    const priceBox = document.querySelector('.df-price');
    if (!priceBox) return; // 폼이 안 열려있으면 할 일 없음
    if (planMode !== 'paid') {
      priceBox.innerHTML = '<div class="amt" style="font-size:1rem;">지금은 체험판이라 무료예요</div><p>마음에 들면 나중에 정식으로 전환하실 수 있어요</p>';
      return;
    }
    const form = document.getElementById('df-form');
    const lenInput = document.getElementById('df-videoLength');
    const sceneInput = document.getElementById('df-sceneCount');
    const isLongform = form && form.value === '롱폼';
    const len = lenInput && lenInput.value ? parseFloat(lenInput.value) : (isLongform ? 3 : 0.75);
    const scenes = sceneInput && sceneInput.value ? parseInt(sceneInput.value) : (isLongform ? 15 : 8);
    priceBox.innerHTML = `<div class="amt" id="df-price-amt">약 ${computePrice(len, scenes).toLocaleString()}원</div><p>선택하신 내용 기준 예상 비용 (실제 확정은 다음 화면에서)</p>`;
  }
  function refreshDirectFormIfOpen() {
    updatePrice(); // 폼이 안 열려있으면 updatePrice 안에서 조용히 무시됨
  }
  badge.addEventListener('click', () => { planMode = planMode === 'paid' ? 'trial' : 'paid'; updateModeBadge(); refreshDirectFormIfOpen(); });
  topBadge.addEventListener('click', () => { planMode = planMode === 'paid' ? 'trial' : 'paid'; updateModeBadge(); refreshDirectFormIfOpen(); });

  const chatLog = document.getElementById('chat-log');
  const composer = document.getElementById('composer-inner');
  const exampleRow = document.getElementById('example-row');

  let mode = null;
  let answers = {};
  let history = [];

  function addMsg(role, html) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.innerHTML = `<div class="avatar">R</div><div class="bubble">${html}</div>`;
    chatLog.appendChild(el);
    chatLog.parentElement.scrollTop = chatLog.parentElement.scrollHeight;
    return el;
  }

  function renderComposer() {
    const staleStatus = document.getElementById('form-status');
    if (staleStatus) { staleStatus.textContent = ''; staleStatus.className = 'form-status'; }
    composer.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'chat-text-row';
    const input = document.createElement('textarea');
    input.rows = 1;
    input.placeholder = '편하게 이야기해보세요';
    input.id = 'chat-text-field';
    input.setAttribute('name', 'rewind-chat-msg-' + Date.now()); // 브라우저가 이전 입력값을 이 필드와 연결해 기억하지 못하도록 매번 다른 이름 사용
    const send = document.createElement('button');
    send.className = 'chat-send-btn';
    send.textContent = '→';
    send.disabled = true;
    const autoGrow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; };
    input.addEventListener('input', () => { send.disabled = !input.value.trim(); autoGrow(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        if (e.shiftKey) return; // Shift+Enter는 줄바꿈 그대로 허용
        e.preventDefault();
        if (input.value.trim()) go(input.value.trim());
      }
    });
    send.addEventListener('click', () => { if (input.value.trim()) go(input.value.trim()); });
    row.appendChild(input); row.appendChild(send);
    composer.appendChild(row);
    setTimeout(() => input.focus(), 50);
    function go(text) { sendMessage(text); }
  }

  const CHAT_STATE_KEY = 'rw_new_chat_state';
  function saveChatState() {
    try { sessionStorage.setItem(CHAT_STATE_KEY, JSON.stringify({ history, answers, mode })); } catch (e) {}
  }
  function clearChatState() {
    try { sessionStorage.removeItem(CHAT_STATE_KEY); } catch (e) {}
  }
  function loadChatState() {
    try {
      const raw = sessionStorage.getItem(CHAT_STATE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  async function retryScriptFromChat(project) {
    addMsg('user', `"${project.title}" 대본 다시 써줘`);
    composer.innerHTML = '<div class="thinking">요청하고 있어요 <span class="dots"><span></span><span></span><span></span></span></div>';
    try {
      const res = await fetch(REVIEW_ACTION_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: googleIdToken, id: project.id, action: 'retry_script' })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok === false) throw new Error((data && data.message) || '요청이 거부됐어요.');
      addMsg('bot', '알겠어요! 대본을 처음부터 다시 만들도록 요청했어요. 완성되면 내 프로젝트에서 다시 확인하실 수 있어요.');
    } catch (e) {
      addMsg('bot', '죄송해요, 다시 만들기 요청이 실패했어요. 내 프로젝트에서 직접 시도해주시겠어요?');
    } finally {
      renderComposer();
    }
  }

  async function sendMessage(text) {
    // [화면 초기화 감지] "화면 지워줘", "처음부터 다시" 같은 요청은 AI에 보내지 않고
    // 그 자리에서 바로 진짜로 화면과 대화 기록을 지운다 (말로만 "다시 안내"하고 화면은 그대로였던 문제 해결).
    const 초기화패턴 = /(화면|채팅|대화).{0,6}(지워|깨끗|초기화|리셋)|처음부터\s*다시|새로\s*시작/;
    if (초기화패턴.test(text)) {
      startFreshChat(true);
      return;
    }
    const staleStatus = document.getElementById('form-status');
    if (staleStatus) { staleStatus.textContent = ''; staleStatus.className = 'form-status'; }
    exampleRow.style.display = 'none';
    addMsg('user', escapeHtml(text));
    history.push({ role: 'user', text });
    composer.innerHTML = '<div class="thinking">생각하고 있어요 <span class="dots"><span></span><span></span><span></span></span></div>';
    try {
      const res = await fetch(CONSULT_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: googleIdToken, history, message: text, pastProjects, collected: answers, mode, planMode })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok === false) throw new Error(`요청 실패 (status: ${res.status}, ok: ${res.ok}, data: ${JSON.stringify(data)})`);
      if (data.mode) mode = data.mode;
      if (data.collected) Object.assign(answers, data.collected);
      const 필수충족 = mode === 'media' ? !!(answers.driveLink && answers.form) : !!(answers.topic && answers.form);
      if (data.reply && !(data.complete && 필수충족)) { addMsg('bot', renderReply(data.reply)); history.push({ role: 'bot', text: data.reply }); }
      saveChatState();
      if (data.complete && 필수충족) {
        showSummary();
      } else {
        if (data.complete && !필수충족) console.warn('[전체 상담 Agent] complete:true였지만 필수 항목 누락 - 계속 진행', answers);
        renderComposer();
      }
    } catch (e) {
      console.error('[전체 상담 Agent 호출 실패]', e);
      addMsg('bot', '죄송해요, 잠시 문제가 있었어요. 다시 한번 말씀해주시겠어요?');
      renderComposer();
    }
  }

  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.topic));
  });

  const LEN_LIMITS = { topic: 300, directorNote: 500, mediaNote: 500, hookText: 18 };
  function clampAnswersAndWarn() {
    const truncated = [];
    Object.keys(LEN_LIMITS).forEach(key => {
      const limit = LEN_LIMITS[key];
      const val = answers[key];
      if (val && val.length > limit) {
        answers[key] = val.slice(0, limit);
        truncated.push(`${FIELD_LABEL[key] || key}(${limit}자)`);
      }
    });
    if (truncated.length) {
      addMsg('bot', `참고로 ${truncated.join(', ')}가 글자수 제한을 넘어서 앞부분만 반영했어요.`);
    }
  }

  function showSummary() {
    clampAnswersAndWarn();
    const rows = Object.keys(answers)
      .filter(k => answers[k])
      .map(k => `<div class="summary-row"><span class="k">${FIELD_LABEL[k] || k}</span><span class="v">${k === 'characterUse' ? (answers[k] ? '예' : '아니오') : escapeHtml(String(answers[k])).slice(0, 60)}</span></div>`)
      .join('');
    addMsg('bot', `이렇게 만들어드릴게요.<div class="summary-card">${rows || '<div class="summary-row"><span class="k">확인된 내용이 없어요</span></div>'}</div>`);

    composer.innerHTML = '';
    const consentWrap = document.createElement('div');
    consentWrap.className = 'confirm-consent';
    consentWrap.innerHTML = `
      <input type="checkbox" id="terms-consent" style="margin-top:3px;">
      <label for="terms-consent"><a href="./terms.html" target="_blank">이용약관 및 개인정보 처리방침</a>에 동의합니다.${mode === 'media' ? ' 업로드 원본은 구글 드라이브에 보관되며, 무료체험 후 24시간 안에 결제가 확인되지 않으면 시스템의 분석 정보는 자동 삭제됩니다.' : ''}</label>`;
    composer.appendChild(consentWrap);

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-gold-sm';
    confirmBtn.textContent = '네, 만들어주세요';
    confirmBtn.disabled = true;
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-line-sm';
    editBtn.textContent = '더 이야기할게요';
    editBtn.addEventListener('click', renderComposer);
    actions.appendChild(confirmBtn); actions.appendChild(editBtn);
    composer.appendChild(actions);

    const consentBox = consentWrap.querySelector('#terms-consent');
    consentBox.addEventListener('change', () => { confirmBtn.disabled = !consentBox.checked; });
    confirmBtn.addEventListener('click', doSubmit);
  }

  async function doSubmit() {
    const status = document.getElementById('form-status');
    status.textContent = ''; status.className = 'form-status';
    const profile = decodeJwt(googleIdToken);
    const payload = { name: (profile && profile.name) || '', contact: (profile && profile.email) || '', idToken: googleIdToken, termsConsent: true, mode: mode || 'topic', planMode };

    if (mode === 'media') {
      payload.driveLink = answers.driveLink || '';
      payload.form = answers.form || '쇼츠';
      if (answers.mediaNote) payload.mediaNote = answers.mediaNote;
      if (answers.voiceGender) payload.voiceGender = answers.voiceGender;
      if (answers.voiceAge) payload.voiceAge = answers.voiceAge;
    } else {
      payload.topic = answers.topic || '';
      payload.form = answers.form || '쇼츠';
      if (answers.productLink) payload.productLink = answers.productLink;
      if (answers.productImageUrl) payload.productImageUrl = answers.productImageUrl;
      if (answers.target) payload.target = answers.target;
      if (answers.tempo) payload.tempo = answers.tempo;
      if (answers.voiceGender) payload.voiceGender = answers.voiceGender;
      if (answers.voiceAge) payload.voiceAge = answers.voiceAge;
      if (answers.directorNote) payload.directorNote = answers.directorNote;
      if (answers.style) payload.style = answers.style;
      if (answers.characterUse !== undefined) payload.characterUse = answers.characterUse;
      if (answers.thumbnail) payload.thumbnail = answers.thumbnail;
    }
    if (answers.hookText) payload.hookText = answers.hookText;
    if (answers.sceneCount) payload.sceneCount = answers.sceneCount;
    if (answers.videoLength) payload.videoLength = answers.videoLength;
    if (answers.estimatedPrice) payload.estimatedPrice = answers.estimatedPrice;

    try {
      const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json().catch(() => null);
      if (!res.ok || (data && data.ok === false)) throw new Error((data && data.message) || '요청이 거부됐어요.');
      clearChatState();
      addMsg('bot', '접수됐어요! 지금 만들어지는 과정을 바로 보여드릴게요.');
      composer.innerHTML = '';
      const newId = data && data.id;
      setTimeout(() => { location.href = newId ? ('./project.html?id=' + encodeURIComponent(newId)) : './dashboard.html'; }, 1400);
    } catch (err) {
      status.textContent = err.message || '접수 중 문제가 생겼어요.';
      status.className = 'form-status err';
    }
  }

  function resetChat() {
    const saved = loadChatState();
    if (saved && Array.isArray(saved.history) && saved.history.length > 0) {
      history = saved.history; answers = saved.answers || {}; mode = saved.mode || null;
      chatLog.innerHTML = '';
      chatLog.appendChild(exampleRow);
      exampleRow.style.display = 'none';
      document.getElementById('form-status').textContent = '';
      history.forEach(h => addMsg(h.role, h.role === 'bot' ? renderReply(h.text) : escapeHtml(h.text)));
      renderComposer();
      return;
    }
    startFreshChat();
  }

  function startFreshChat(skipPendingCheck) {
    mode = null; answers = {}; history = [];

      btnCheck.textContent = '내 프로젝트 보기';

      btnNew.textContent = '새로 만들기';
      btnNew.addEventListener('click', () => startFreshChat(true));
      row.appendChild(btnCheck); row.appendChild(btnNew);

      // 검수 대기(대본 완성) 상태인 게 정확히 1개일 때만 - 여러 개면 어느 걸 재시도할지 애매해서 목록에서 직접 고르게 함
      const 검수대기목록 = pendingList.filter(p => p.status === '검수 대기');

        btnRetry.textContent = '✍️ 대본 다시 써줘';
        btnRetry.addEventListener('click', () => retryScriptFromChat(검수대기목록[0]));

    let greeting;

      greeting = (name ? `안녕하세요, ${escapeHtml(name)}님! ` : '안녕하세요! ') +

  function computePrice(lengthMin, sceneCount) {
    let price = 3000 + (lengthMin * 1500) + (sceneCount * 1200);
    if (lengthMin > 60) price = Math.round(price * 1.2);
    return Math.round(price);
  }

  (function setupSplitResizer() {
    const resizer = document.getElementById('split-resizer');
    const formWrap = document.getElementById('direct-form-wrap');
    const row = document.getElementById('split-row');
    let dragging = false;
    resizer.addEventListener('mousedown', (e) => {
      dragging = true;
      resizer.classList.add('dragging');
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const rowRect = row.getBoundingClientRect();
      let pct = ((e.clientX - rowRect.left) / rowRect.width) * 100;
      pct = Math.max(25, Math.min(75, pct)); // 너무 좁거나 넓어지지 않도록 25~75% 사이로 제한
      formWrap.style.flex = `0 0 ${pct}%`;
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
    });
  })();

  async function enterApp(idToken) {
    const profile = decodeJwt(idToken);
    if (!profile) return;
    googleIdToken = idToken;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('account-avatar').src = profile.picture || '';
    document.getElementById('account-name').textContent = profile.name || profile.email || '';
    await loadPastProjects(idToken);
    resetChat();
  }

  async function loadPastProjects(idToken) {
    try {
      const res = await fetch(PROJECTS_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        console.error('[내 프로젝트 목록 조회 실패]', 'status:', res.status, 'data:', data);
      }
      pastProjects = (data && data.projects) || [];
      console.log('[내 프로젝트 목록 조회] 가져온 개수:', pastProjects.length, pastProjects);
    } catch (e) {
      console.error('[내 프로젝트 목록 조회 실패 - 네트워크/예외]', e);
      pastProjects = [];
    }
  }
  window.handleGoogleSignIn = function (response) {
    sessionStorage.setItem('rw_id_token', response.credential);
    enterApp(response.credential);
    const data = decodeJwt(response.credential);
    if (data) scheduleTokenRefresh(data.exp);
  };

  // 토큰이 만료되기 조금 전에, 사용자가 전혀 눈치채지 못하게 조용히 새 토큰을 다시 받아온다
  let __refreshTimer = null;
  function scheduleTokenRefresh(expSeconds) {
    if (__refreshTimer) clearTimeout(__refreshTimer);
    if (!expSeconds) return;
    const 남은시간ms = (expSeconds * 1000) - Date.now() - (5 * 60 * 1000); // 만료 5분 전에 미리 갱신
    const 대기시간 = Math.max(5000, 남은시간ms);
    __refreshTimer = setTimeout(() => {
      try { google.accounts.id.prompt(); } catch (e) {}
    }, 대기시간);
  }

  function initGate() {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window.handleGoogleSignIn, auto_select: true });
      google.accounts.id.renderButton(document.getElementById('gsi-area'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });
      const saved = sessionStorage.getItem('rw_id_token');
      if (saved) {
        const profile = decodeJwt(saved);
        const 지금초 = Math.floor(Date.now() / 1000);
        if (profile && profile.exp && profile.exp > 지금초 + 60) {
          enterApp(saved);
          scheduleTokenRefresh(profile.exp);
          return;
        }
        try { google.accounts.id.prompt(); } catch (e) {}
      }
    } else {
      setTimeout(initGate, 200);
    }
  }
  initGate();
})();
</script>
