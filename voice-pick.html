<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>목소리 고르기</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--ink:#1c1e22;--dim:#6b7078;--line:#e2e4e8;--ac:#2f6bff}
@media(prefers-color-scheme:dark){:root{--bg:#17181b;--card:#222428;--ink:#eceef1;--dim:#9aa0a8;--line:#33363c;--ac:#6c95ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:1.1rem;margin:0 0 6px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
button[aria-pressed=true],button.p{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.c.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.c b{display:block}.c small{color:var(--dim)}audio{width:100%;margin:6px 0 4px;height:34px}label{display:flex;gap:8px;align-items:center;cursor:pointer}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim);margin-left:6px}
#out{display:none;margin:12px 16px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;white-space:pre-wrap}</style></head><body>
<header><h1>목소리 고르기 <small style="font-weight:400;color:var(--dim)">▶ 눌러서 들어 보고, 마음에 드는 목소리에 체크하세요</small></h1>
<div class="row"><button data-f="all" aria-pressed="true">전체</button><button data-f="m" aria-pressed="false">남자</button><button data-f="f" aria-pressed="false">여자</button><button data-f="cur" aria-pressed="false">지금 쓰는 것</button><button data-f="sel" aria-pressed="false">고른 것</button><button class="p" id="done">다 골랐어요 (선택 목록 보기)</button></div></header>
<div id="out"></div><main id="g"></main>
<script>const D=[{"id": "Korean_AthleticStudent", "n": "AthleticStudent", "m": true, "c": false, "a": ""}, {"id": "Korean_BraveYouth", "n": "BraveYouth", "m": true, "c": true, "a": ""}, {"id": "Korean_CalmGentleman", "n": "CalmGentleman", "m": true, "c": true, "a": ""}, {"id": "Korean_CheerfulBoyfriend", "n": "CheerfulBoyfriend", "m": true, "c": false, "a": ""}, {"id": "Korean_CheerfulCoolJunior", "n": "CheerfulCoolJunior", "m": true, "c": false, "a": ""}, {"id": "Korean_CockyGuy", "n": "CockyGuy", "m": true, "c": false, "a": ""}, {"id": "Korean_ColdYoungMan", "n": "ColdYoungMan", "m": true, "c": false, "a": ""}, {"id": "Korean_ConfidentBoss", "n": "ConfidentBoss", "m": true, "c": true, "a": ""}, {"id": "Korean_ConsiderateSenior", "n": "ConsiderateSenior", "m": true, "c": false, "a": ""}, {"id": "Korean_DominantMan", "n": "DominantMan", "m": true, "c": false, "a": ""}, {"id": "Korean_GentleBoss", "n": "GentleBoss", "m": true, "c": true, "a": ""}, {"id": "Korean_InnocentBoy", "n": "InnocentBoy", "m": true, "c": false, "a": ""}, {"id": "Korean_IntellectualMan", "n": "IntellectualMan", "m": true, "c": true, "a": ""}, {"id": "Korean_IntellectualSenior", "n": "IntellectualSenior", "m": true, "c": true, "a": ""}, {"id": "Korean_LonelyWarrior", "n": "LonelyWarrior", "m": true, "c": false, "a": ""}, {"id": "Korean_OptimisticYouth", "n": "OptimisticYouth", "m": true, "c": false, "a": ""}, {"id": "Korean_PossessiveMan", "n": "PossessiveMan", "m": true, "c": false, "a": ""}, {"id": "Korean_ReliableYouth", "n": "ReliableYouth", "m": true, "c": false, "a": ""}, {"id": "Korean_StrictBoss", "n": "StrictBoss", "m": true, "c": false, "a": ""}, {"id": "Korean_WiseTeacher", "n": "WiseTeacher", "m": true, "c": false, "a": ""}, {"id": "Korean_AirheadedGirl", "n": "AirheadedGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_AthleticGirl", "n": "AthleticGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_BraveAdventurer", "n": "BraveAdventurer", "m": false, "c": false, "a": ""}, {"id": "Korean_BraveFemaleWarrior", "n": "BraveFemaleWarrior", "m": false, "c": false, "a": ""}, {"id": "Korean_CalmLady", "n": "CalmLady", "m": false, "c": false, "a": ""}, {"id": "Korean_CaringWoman", "n": "CaringWoman", "m": false, "c": true, "a": ""}, {"id": "Korean_CharmingElderSister", "n": "CharmingElderSister", "m": false, "c": false, "a": ""}, {"id": "Korean_CharmingSister", "n": "CharmingSister", "m": false, "c": false, "a": ""}, {"id": "Korean_CheerfulLittleSister", "n": "CheerfulLittleSister", "m": false, "c": false, "a": ""}, {"id": "Korean_ChildhoodFriendGirl", "n": "ChildhoodFriendGirl", "m": false, "c": true, "a": ""}, {"id": "Korean_ColdGirl", "n": "ColdGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_DecisiveQueen", "n": "DecisiveQueen", "m": false, "c": false, "a": ""}, {"id": "Korean_ElegantPrincess", "n": "ElegantPrincess", "m": false, "c": false, "a": ""}, {"id": "Korean_EnchantingSister", "n": "EnchantingSister", "m": false, "c": false, "a": ""}, {"id": "Korean_EnthusiasticTeen", "n": "EnthusiasticTeen", "m": false, "c": false, "a": ""}, {"id": "Korean_FriendlyBigSister", "n": "FriendlyBigSister", "m": false, "c": false, "a": ""}, {"id": "Korean_GentleWoman", "n": "GentleWoman", "m": false, "c": true, "a": ""}, {"id": "Korean_HaughtyLady", "n": "HaughtyLady", "m": false, "c": false, "a": ""}, {"id": "Korean_MatureLady", "n": "MatureLady", "m": false, "c": true, "a": ""}, {"id": "Korean_MysteriousGirl", "n": "MysteriousGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_QuirkyGirl", "n": "QuirkyGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_ReliableSister", "n": "ReliableSister", "m": false, "c": false, "a": ""}, {"id": "Korean_SassyGirl", "n": "SassyGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_ShyGirl", "n": "ShyGirl", "m": false, "c": false, "a": ""}, {"id": "Korean_SoothingLady", "n": "SoothingLady", "m": false, "c": true, "a": ""}, {"id": "Korean_SweetGirl", "n": "SweetGirl", "m": false, "c": true, "a": ""}, {"id": "Korean_ThoughtfulWoman", "n": "ThoughtfulWoman", "m": false, "c": true, "a": ""}, {"id": "Korean_WiseElf", "n": "WiseElf", "m": false, "c": false, "a": ""}];const g=document.getElementById('g');let flt='all';const S=new Set();
function draw(){g.innerHTML='';D.forEach(v=>{const ok=flt==='all'||(flt==='m'&&v.m)||(flt==='f'&&!v.m)||(flt==='cur'&&v.c)||(flt==='sel'&&S.has(v.id));if(!ok)return;
const d=document.createElement('div');d.className='c'+(S.has(v.id)?' sel':'');
d.innerHTML='<label><input type="checkbox" '+(S.has(v.id)?'checked':'')+'><b>'+v.n+(v.c?'<span class="tag">지금 쓰는 것</span>':'')+'</b></label><small>'+(v.m?'남자':'여자')+'</small><audio controls preload="none" src="./assets/voice-samples/'+v.id+'.mp3"></audio>';
d.querySelector('input').onchange=e=>{e.target.checked?S.add(v.id):S.delete(v.id);d.classList.toggle('sel',e.target.checked)};
d.querySelector('audio').onplay=e=>document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()});g.appendChild(d)})}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
document.getElementById('done').onclick=()=>{const o=document.getElementById('out');o.style.display='block';o.textContent='고른 목소리 ('+S.size+'개)\n'+[...S].join('\n')+'\n\n이 목록을 복사해서 Claude 에게 보내 주세요.';scrollTo(0,0)};draw();</script></body></html>
